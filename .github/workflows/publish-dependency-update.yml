# SPDX-License-Identifier: MIT
name: Prepare and publish a dependency update
on:
  workflow_call:
    inputs:
      base:
        required: true
        type: string
      mise_version:
        required: true
        type: string
      changes:
        required: true
        type: string
      branch:
        required: true
        type: string
      title:
        required: true
        type: string
      body:
        required: true
        type: string
      artifact:
        required: true
        type: string
    secrets:
      app_private_key:
        required: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base }}
          fetch-tags: true
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        if: fromJSON(inputs.changes)[0] != null
        with:
          version: ${{ inputs.mise_version }}
          cache: false

      - name: Download and upgrade pack, then test a cold locked install (manual minor/patch run)
        if: github.event_name == 'workflow_dispatch' && (inputs.branch == 'automation/dependencies-minor/mise' || inputs.branch == 'automation/dependencies-minor') && fromJSON(inputs.changes)[0] != null
        run: bats tools/test/integration/mise_dependency_upgrade.bats

      - name: Apply the planned versions and refresh affected locks
        if: fromJSON(inputs.changes)[0] != null
        env:
          CHANGES: ${{ inputs.changes }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B tools/build/upgrade_dependencies.py apply "$CHANGES"

      - name: Auto-format modified files with upgraded tools
        if: fromJSON(inputs.changes)[0] != null
        run: hk fix --all || true

      - name: Smoke-test the build with updated dependencies
        if: fromJSON(inputs.changes)[0] != null
        env:
          TITLE: ${{ inputs.title }}
          BRANCH: ${{ inputs.branch }}
          BODY: ${{ inputs.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! bazel build //... > "$RUNNER_TEMP/smoke-test.log" 2>&1; then
            echo "Smoke test failed for $TITLE" >&2
            tail -n 50 "$RUNNER_TEMP/smoke-test.log" >&2

            {
              echo "### ❌ Smoke test failed: $TITLE"
              echo "The build smoke test (\`bazel build //...\`) failed after applying proposed dependency updates."
              echo "PR publication was skipped to prevent opening a broken pull request."
              echo ""
              echo "#### Planned updates"
              echo "$BODY"
              echo ""
              echo "<details><summary>Build failure output (tail)</summary>"
              echo ""
              echo '```'
              tail -n 40 "$RUNNER_TEMP/smoke-test.log"
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"

            issue_title="[Dependencies] Smoke test failed: $TITLE"
            existing_issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$issue_title in:title" --json number --jq '.[0].number' 2>/dev/null || true)
            error_tail=$(tail -n 25 "$RUNNER_TEMP/smoke-test.log")

            {
              echo "Automated dependency update **$TITLE** failed the build smoke test (\`bazel build //...\`)."
              echo ""
              echo "- **Target branch:** \`$BRANCH\`"
              echo "- **Workflow run:** [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
              echo ""
              echo "### Proposed Updates"
              echo "$BODY"
              echo ""
              echo "### Build Failure Output"
              echo '```'
              echo "$error_tail"
              echo '```'
            } > "$RUNNER_TEMP/issue_body.md"

            if [ -n "$existing_issue" ]; then
              comment_body=$(printf "Smoke test failed again in run [%s](%s/%s/actions/runs/%s):\n\n\`\`\`\n%s\n\`\`\`" "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$error_tail")
              gh issue comment "$existing_issue" --repo "$GITHUB_REPOSITORY" --body "$comment_body" || true
            else
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$issue_title" \
                --body-file "$RUNNER_TEMP/issue_body.md" \
                --label "bug" 2>/dev/null || \
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$issue_title" \
                --body-file "$RUNNER_TEMP/issue_body.md" || true
            fi

            exit 1
          fi

      - name: Package the changes, including new and removed lockfiles
        run: |
          find . \( -name "*.pyc" -o -name "__pycache__" \) -exec rm -rf {} + 2>/dev/null || true
          git add -A
          git diff --cached --binary HEAD > "$RUNNER_TEMP/dependencies.patch"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/dependencies.patch
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    needs: apply
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: main
          fetch-tags: true
          persist-credentials: false

      - name: Report a stale plan
        if: steps.checkout.outputs.commit != inputs.base
        run: echo "Skipped publication because main moved after planning. The next daily or manual run will refresh this PR." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.checkout.outputs.commit == inputs.base
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/dependency-update

      - name: Verify the patch against the trusted plan and checkout
        id: verify
        if: steps.checkout.outputs.commit == inputs.base
        env:
          CHANGES: ${{ inputs.changes }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B tools/build/verify_dependency_patch.py "$RUNNER_TEMP/dependency-update/dependencies.patch" "$CHANGES" >> "$GITHUB_OUTPUT"

      - name: Clean up temporary files
        run: find . \( -name "*.pyc" -o -name "__pycache__" \) -exec rm -rf {} + 2>/dev/null || true

      - name: Mint Kludgebot token for branch and PR publication
        if: steps.checkout.outputs.commit == inputs.base
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          # Public client ID from github.com/apps/kludgebot.
          client-id: Iv23liYVAElUC3TAzSSx
          private-key: ${{ secrets.app_private_key }}
          # Omit owner and repositories to scope the token to this repository.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: ${{ steps.verify.outputs.workflows_changed == 'true' && 'write' || '' }}

      - name: Report reformatted source files
        if: steps.checkout.outputs.commit == inputs.base && steps.verify.outputs.extra_files != ''
        run: |
          {
            echo "### ⚠️ Files modified by formatters"
            echo "The following files outside lock and build files were modified by upgraded formatters:"
            echo '${{ steps.verify.outputs.extra_files }}' | jq -r '.[] | "- `\(.)`"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close obsolete pull request
        if: steps.checkout.outputs.commit == inputs.base && fromJSON(inputs.changes)[0] == null
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ inputs.branch }}
          COMMENT: ${{ inputs.body }}
        run: |
          prs=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[].number')
          if [ -n "$prs" ]; then
            for pr in $prs; do
              gh pr close "$pr" --comment "$COMMENT" --delete-branch
            done
          else
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" || true
          fi

      - name: Open or refresh the pull request
        if: steps.checkout.outputs.commit == inputs.base && fromJSON(inputs.changes)[0] != null
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          # Using the App for PR creation and branch pushes triggers pull_request CI.
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ inputs.branch }}
          base: main
          delete-branch: true
          sign-commits: true
          commit-message: 'chore: ${{ inputs.title }}'
          title: 'chore: ${{ inputs.title }}'
          body: ${{ inputs.body }}

      - name: Close resolved smoke test failure issues
        if: steps.checkout.outputs.commit == inputs.base && fromJSON(inputs.changes)[0] != null
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
        run: |
          issue_title="[Dependencies] Smoke test failed: $TITLE"
          existing_issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$issue_title in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing_issue" ]; then
            gh issue close "$existing_issue" --repo "$GITHUB_REPOSITORY" --comment "Resolved: Smoke test passed in run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) and the update PR was published." || true
          fi
