# SPDX-License-Identifier: MIT
name: Prepare and publish a dependency update
on:
  workflow_call:
    inputs:
      base:
        required: true
        type: string
      mise_version:
        required: true
        type: string
      changes:
        required: true
        type: string
      branch:
        required: true
        type: string
      title:
        required: true
        type: string
      body:
        required: true
        type: string
      artifact:
        required: true
        type: string
    secrets:
      app_private_key:
        required: true

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base }}
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        if: fromJSON(inputs.changes)[0] != null
        with:
          version: ${{ inputs.mise_version }}
          cache: false

      - name: Download and upgrade pack, then test a cold locked install (manual minor/patch run)
        if: github.event_name == 'workflow_dispatch' && inputs.branch == 'automation/dependencies-minor' && fromJSON(inputs.changes)[0] != null
        run: bats tools/test/integration/mise_dependency_upgrade.bats

      - name: Apply the planned versions and refresh affected locks
        if: fromJSON(inputs.changes)[0] != null
        env:
          CHANGES: ${{ inputs.changes }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/build/upgrade_dependencies.py apply "$CHANGES"

      - name: Package the changes, including new and removed lockfiles
        run: |
          git add -A -- .github mise.toml mise.lock .mise/locks MODULE.bazel MODULE.bazel.lock maven_install.json
          git diff --cached --binary HEAD > "$RUNNER_TEMP/dependencies.patch"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/dependencies.patch
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    needs: apply
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: main
          persist-credentials: false

      - name: Report a stale plan
        if: steps.checkout.outputs.commit != inputs.base
        run: echo "Skipped publication because main moved after planning. The next daily or manual run will refresh this PR." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.checkout.outputs.commit == inputs.base
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/dependency-update

      - name: Verify the patch against the trusted plan and checkout
        id: verify
        if: steps.checkout.outputs.commit == inputs.base
        env:
          CHANGES: ${{ inputs.changes }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/build/verify_dependency_patch.py "$RUNNER_TEMP/dependency-update/dependencies.patch" "$CHANGES" >> "$GITHUB_OUTPUT"

      - name: Mint Kludgebot token for branch and PR publication
        if: steps.checkout.outputs.commit == inputs.base
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # Public client ID from github.com/apps/kludgebot.
          client-id: Iv23liYVAElUC3TAzSSx
          private-key: ${{ secrets.app_private_key }}
          # Omit owner and repositories to scope the token to this repository.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: ${{ steps.verify.outputs.workflows_changed == 'true' && 'write' || '' }}

      - name: Open, refresh or retire the pull request
        if: steps.checkout.outputs.commit == inputs.base
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          # Using the App for PR creation and branch pushes triggers pull_request CI.
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ inputs.branch }}
          base: main
          delete-branch: true
          add-paths: |
            .github/workflows/
            .github/actions/
            mise.toml
            mise.lock
            .mise/locks/
            MODULE.bazel
            MODULE.bazel.lock
            maven_install.json
          commit-message: 'chore: ${{ inputs.title }}'
          title: 'chore: ${{ inputs.title }}'
          body: ${{ inputs.body }}
