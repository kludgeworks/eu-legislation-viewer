# SPDX-License-Identifier: MIT
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The mise CI runs, the one mise.toml's min_version asks of everyone: mise-action otherwise takes
  # the newest, whose lockfile may differ from the one committed
  MISE_VERSION: 2026.11.3

jobs:
  verify:
    # Not the release's commit (mise run release), the only one its push adds to main: the Release
    # workflow checks and tests it, from its tag. Not [skip ci], which would skip that too.
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore(release): prepare ') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.MISE_VERSION }}

      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: mise run check
      # the compile's checks too: Error Prone, NullAway and doclint fail the build
      - name: Build and test
        run: mise run test
      - run: bazel build //viewer:jar
