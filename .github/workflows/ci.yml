# SPDX-License-Identifier: MIT
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The mise CI runs, the one mise.toml's min_version asks of everyone: mise-action otherwise takes
  # the newest, whose lockfile may differ from the one committed
  MISE_VERSION: 2026.11.3

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the release tags: the migrations' check compares the released ones with the latest
          fetch-tags: true
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: ${{ env.MISE_VERSION }}

      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: mise run check
      - name: Dependency vulnerability check
        run: mise run lint:deps
      # the compile's checks too: Error Prone, NullAway and doclint fail the build
      - name: Build and test
        run: mise run test
      - run: bazel build //viewer:jar
