# SPDX-License-Identifier: MIT
name: Upgrade dependencies

on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize discovery and publication together so concurrent pushes share the same PR cap.
concurrency:
  group: dependency-upgrades
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      base: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: main
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: '2026.11.6'
          install: false

      - name: Select one combined update and up to three individual majors
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash tools/build/plan-dependency-prs.bash

  update:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: ${{ matrix.title }}
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: main
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        if: steps.checkout.outputs.commit == needs.plan.outputs.base && matrix.changes[0] != null
        with:
          version: '2026.11.6'
          cache-save: false

      - name: Apply the planned versions and refresh affected locks
        if: steps.checkout.outputs.commit == needs.plan.outputs.base && matrix.changes[0] != null
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
          CHANGES: ${{ toJSON(matrix.changes) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/build/upgrade_dependencies.py apply "$CHANGES"

      - name: Open, refresh or retire the pull request
        if: steps.checkout.outputs.commit == needs.plan.outputs.base
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          # A workflow-writing token is needed to push updated .github/workflows files.
          token: ${{ secrets.DEPENDENCY_UPGRADE_TOKEN || github.token }}
          branch: ${{ matrix.branch }}
          base: main
          delete-branch: true
          add-paths: |
            .github/workflows/
            .github/actions/
            mise.toml
            mise.lock
            .mise/locks/
            MODULE.bazel
            MODULE.bazel.lock
            maven_install.json
          commit-message: 'chore: ${{ matrix.title }}'
          title: 'chore: ${{ matrix.title }}'
          body: |
            Generated from main. Review the version and lockfile changes and merge when ready.
