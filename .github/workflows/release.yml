# SPDX-License-Identifier: MIT
name: Release

# Started by hand (mise run release, or the Actions tab) on main. Nothing is committed or tagged
# until the release is tested and its JAR and image are built: a run that fails leaves main and
# the tags as they were, and the next run makes the same version.
on:
  workflow_dispatch:

permissions: {}

# One release at a time: each takes the next version from the tags
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kludgeworks/eu-legislation-viewer
  # The mise every job runs, the one mise.toml's min_version asks of everyone: mise-action
  # otherwise takes the newest, whose lockfile may differ from the one committed
  MISE_VERSION: 2026.11.6

jobs:
  # The release prepared on main as it was when the run started (release:prepare): its checks, its
  # tests and its CalVer-stamped JAR, which the image is built from.
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      base: ${{ steps.checkout.outputs.commit }}
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      tree: ${{ steps.prepare.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          cache: false

      - id: prepare
        run: mise run release:prepare --output "$GITHUB_OUTPUT"

      - if: steps.prepare.outputs.tag == ''
        run: |
          echo "Nothing to release: nothing changed since the latest release." >> "$GITHUB_STEP_SUMMARY"

      # main's disk cache, which CI saves, and the remote cache to read: a release only reads it
      - if: steps.prepare.outputs.tag != ''
        uses: ./.github/actions/bazel
        with:
          cache-save: false
          remote-cache: ${{ vars.BAZEL_REMOTE_CACHE }}
          tailscale-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          tailscale-audience: ${{ vars.TS_OIDC_AUDIENCE }}

      # every check on the prepared tree, but not hk's check of the pending migrations: they are
      # named released now, by a version not tagged yet. The next step checks them as released.
      - if: steps.prepare.outputs.tag != ''
        env:
          PINACT_GITHUB_TOKEN: ${{ github.token }}
          HK_SKIP_STEPS: flyway_migrations
        run: mise run check
      - if: steps.prepare.outputs.tag != ''
        run: tools/tasks/release/db-migrations.bash --final
      - if: steps.prepare.outputs.tag != ''
        run: bazel test //...

      - if: steps.prepare.outputs.tag != ''
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          TAG: ${{ steps.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          mise run release:artifact "$VERSION"
          mise run release:notes "$TAG" --repo "$REPO" --output dist/release-notes.md

      - if: steps.prepare.outputs.tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/kludgeworks-viewer-${{ steps.prepare.outputs.version }}.jar

      - if: steps.prepare.outputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # Each architecture's image is built on its own runner, with Paketo's buildpacks, from the
  # same JAR, and published under a per-architecture tag; manifest joins them. They are published
  # before the release is tagged: a run that fails after them leaves them without a release, and
  # the next run, of the same version, replaces them.
  # Ran on 24.04: Docker 29's containerd store on 26.04 breaks pack (buildpacks/pack#2527).
  image:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            tag: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            tag: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: pack
          cache: false

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # only pack is installed here: the task needs nothing else
      - env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.version }}-${{ matrix.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: mise run release:image "$VERSION" --tag "$TAG" --platform "$PLATFORM" --publish

  # The multi-architecture image under the version's tag, and its provenance.
  manifest:
    needs: [prepare, image]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: pack
          cache: false

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # pack manifest is experimental, hidden until experimental features are on
      - id: manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          pack config experimental true
          pack manifest create "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-linux-amd64" \
            "$IMAGE:$VERSION-linux-arm64" \
            --publish
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  # Once the JAR and the image are both there: the release committed to main and tagged by the
  # GitHub App (kludgebot), the commit signed by GitHub, and the GitHub release with the JAR.
  publish:
    needs: [prepare, manifest]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          cache: false

      # the same release again, from the same commit: release:publish checks it is the tested tree
      - run: mise run release:prepare

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist

      - name: Mint Kludgebot token for the release's commit, tag and GitHub release
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          # Public client ID from github.com/apps/kludgebot.
          client-id: Iv23liYVAElUC3TAzSSx
          private-key: ${{ secrets.KLUDGEBOT_PRIVATE_KEY }}
          # Omit owner and repositories to scope the token to this repository.
          permission-contents: write

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_BASE: ${{ needs.prepare.outputs.base }}
          RELEASE_TREE: ${{ needs.prepare.outputs.tree }}
        run: mise run release:publish "$TAG"

      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DIST: ${{ runner.temp }}/dist
        shell: bash
        run: |
          set -euo pipefail
          artifact="$DIST/kludgeworks-viewer-$VERSION.jar"
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$DIST/release-notes.md" \
            "$artifact#Application JAR" \
            "$artifact.sha256#SHA-256 Checksum"
  # A run that failed or was cancelled: the images it published, deleted (release:discard), unless
  # it tagged the release, whose images they then are. A cleanup only: the next run of the same
  # version replaces them anyway. The token may delete them if the repository has the Admin role
  # in the package's settings (Manage Actions access).
  discard:
    needs: [prepare, image, manifest, publish]
    if: (failure() || cancelled()) && needs.prepare.outputs.tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          install: false
          cache: false

      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run release:discard "$VERSION"
