# SPDX-License-Identifier: MIT
# Vale, hk's vale step: the words of the business rules (viewer/src/test/rules), in ASD-STE100
# Simplified Technical English. Vale has no Gherkin format: the Gherkin View reads a feature's rule
# names, titles, descriptions and steps, and passes over its tables, doc strings, tags and comments.
StylesPath = tools/vale/styles
MinAlertLevel = warning

[*.feature]
View = Gherkin
# ste: vale-ste v0.1.1 (github.com/amoslives/vale-ste), as it is. Kludgeworks: ours
BasedOnStyles = ste, Kludgeworks
# Kludgeworks.Modals checks the modals in their place: "May" the month is no modal
ste.Modals = NO
# Kludgeworks.SentenceLength counts the words in its place: an act or a provision is one word
ste.SentenceLength = NO
# a quotation is the words of the law or of a page, as they are: not ours to write in STE
TokenIgnores = ("[^"\n]*")
