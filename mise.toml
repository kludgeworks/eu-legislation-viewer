[tools]
delta = "latest"
java = "liberica-23"
jq = "latest"
shellcheck = "latest"

[tasks.to-excel]
description = "transform xml to excel"
run = "xsltproc xslt/excel.xslt xslt/sample.xml"

#[tasks.to-markdown]
#description = "transform xml to markdown"
#run = "cargo build"

[tasks.download]
description = "transform xml to excel"
run = "java -jar target/eu.legislation.cli-0.0.1-SNAPSHOT.jar download 32015R1998"

[tasks.to-legislation]
description = "transform xml to html"
run = """
xsltproc --xinclude xslt/legislation/main.xslt - <<EOF > 32015R1998.html
<root>
  <xi:include href="legislation/32015R1998/DOC_2.xml" xmlns:xi="http://www.w3.org/2001/XInclude"/>
  <xi:include href="legislation/32015R1998/DOC_3.xml" xmlns:xi="http://www.w3.org/2001/XInclude"/>
</root>
EOF
"""

[tasks.xslt-to-string]
description = "transform xml to html"
run = """
find xslt/legislation -name "*.xslt" | while read file; do
  echo "\n## $file\n"
  cat "$file"
  echo "\n"
done
"""