# SPDX-License-Identifier: MIT
#:schema https://mise.jdx.dev/schema/mise.json

# The tools on the developer's PATH and the commands people and CI run. Bazel stays responsible for
# everything hermetic: its own version (.bazelversion, read by bazelisk), the JDK that builds and
# tests (remotejdk_25), Maven dependencies, code generation and tests.

[settings]
lockfile = true # mise.lock adds the checksums; versions are pinned below, upgraded on purpose

[task_config]
# file tasks live beside the Bazel tooling, under tools/, in a folder of their own: mise would take
# any executable file below an included folder for a task
includes = ["tools/tasks"]

[env]
HK_MISE = 1
LICENSE_TYPE = "mit"
LICENSE_HOLDER = "The Project Contributors"

[tools]
# bazelisk as bazel, the name the tasks and hk call; it runs the version in .bazelversion
"github:bazelbuild/bazelisk" = { version = "1.30.0", bin = "bazel" }
buildifier = "10.1.0"
"aqua:bazelbuild/buildtools/buildozer" = "10.1.0"
java = "temurin-25.0.5+8.0.LTS"                                      # for the IDE and jshell; Bazel uses its own remotejdk_25
hk = "2.9.0"                                                         # the version in hk.pkl's amends URL
pkl = "0.32.2"                                                       # hk's configuration language
google-java-format = "1.37.0"
"github:google/addlicense" = "1.2.0"
# REUSE: every file's copyright and licence (REUSE.toml)
"pipx:reuse" = { version = "6.2.0", extras = "charset-normalizer" }
taplo = "0.10.0"
typos = "1.51.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"
jactionlint = "2.1.0"
"github:suzuki-shunsuke/pinact" = "5.0.2"
# ruff: lints and formats the tasks in tools/tasks written in Python, which uv runs with the
# dependencies each declares (PEP 723)
ruff = "0.17.1"
# uv: runs those tasks, and installs the pipx: tools (mise uses it when it is on PATH)
uv = "0.13.4"

[hooks]
postinstall = "hk install --mise"

[tasks.build]
description = "Build everything"
run = "bazel build //..."

[tasks.test]
description = "Run every test"
run = "bazel test //..."

[tasks.app]
description = "Run the viewer, on the Postgres at spring.datasource.*"
run = "bazel run //viewer:app"

[tasks."app:dev"]
description = "Run the viewer with its store and Grafana in containers (Docker), kept across runs"
run = "bazel run //viewer:dev"

[tasks."test:xspec"]
description = "Run the XSpec suites"
run = "bazel test //formex-converter/src/test/xspec/..."

[tasks.expected]
description = "Rewrite the converter's expected output from the fixtures, after a deliberate change"
run = "bazel run //formex-converter/src/test/java/dev/groknull/kludgeworks/formex/converter:update_expected"

[tasks.modules]
description = "Write the modules' documentation (Spring Modulith's Documenter) into viewer/spring-modulith-docs"
run = "bazel run //viewer/src/test/java/dev/groknull/kludgeworks/eu/legislation/viewer:modules"

[tasks."release:artifact"]
description = "Build the CalVer-stamped viewer JAR and its SHA-256 checksum (VERSION is required)"
run = """
test -n "${VERSION:-}" || { echo "VERSION is required" >&2; exit 1; }
bazel build --embed_label="$VERSION" //viewer:jar
mkdir -p dist
artifact="dist/kludgeworks-viewer-$VERSION.jar"
cp bazel-bin/viewer/src/main/java/dev/groknull/kludgeworks/eu/legislation/viewer/viewer-app.jar "$artifact"
sha256sum "$artifact" > "$artifact.sha256"
"""

[tasks.pin]
description = "Pin the Maven dependencies after changing them in MODULE.bazel"
run = "REPIN=1 bazel run @maven//:pin"

[tasks.check]
description = "Run every hk check on every file"
run = "hk check --all"

[tasks.fix]
description = "Run every hk fixer on every file"
run = "hk fix --all"
