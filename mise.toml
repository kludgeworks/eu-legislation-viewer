# SPDX-License-Identifier: MIT
#:schema https://mise.jdx.dev/schema/mise.json

# The mise the lockfile is written with; CI runs this one (MISE_VERSION in .github/workflows)
min_version = "2026.11.3"


[settings]
lockfile = true

[task_config]
includes = ["tools/tasks.toml", "tools/tasks"]

[env]
HK_MISE = 1
LICENSE_TYPE = "mit"
LICENSE_HOLDER = "The Project Contributors"

[tools]
# bazelisk as bazel, the name the tasks and hk call; it runs the version in .bazelversion
"github:bazelbuild/bazelisk" = { version = "1.30.0", bin = "bazel" }
buildifier = "10.1.0"
"aqua:bazelbuild/buildtools/buildozer" = "10.1.0"
java = "temurin-25.0.5+8.0.LTS"                                      # for the IDE and jshell; Bazel uses its own remotejdk_25
hk = "2.9.0"                                                         # the version in hk.pkl's amends URL
pkl = "0.32.2"                                                       # pkl_format: hk evaluates hk.pkl itself
google-java-format = "1.37.0"
"github:google/addlicense" = "1.2.0"
# REUSE: every file's copyright and licence (REUSE.toml)
"pipx:reuse" = { version = "6.3.0", extras = "charset-normalizer" }
taplo = "0.10.0"
typos = "1.51.1"
shellcheck = "0.11.0"
shfmt = "3.14.1"
bats = "1.14.0"
jactionlint = "2.4.0"
"github:suzuki-shunsuke/pinact" = "5.0.2"
ruff = "0.17.1"
uv = "0.13.4"
pack = "0.40.10"
kubeconform = "0.8.0"
kube-linter = "0.8.3"
gum = "0.17.0"                                                      # the task scripts' styled messages and questions (tools/tasks/lib/ui.bash)

[hooks]
postinstall = "hk install --mise"
