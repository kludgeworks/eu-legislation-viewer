spring:
  application:
    name: eu.legislation.cli
  shell:
    history:
      enabled: 'true'
  main:
    banner-mode: 'off'
  web:
    resources:
      add-mappings: true
server:
  port: 8080
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml
    min-response-size: 2048
logging:
  file:
    name: eu.legislation.cli.log
  pattern:
    console: