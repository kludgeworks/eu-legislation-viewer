# SPDX-License-Identifier: MIT
# tbls: the database's lint (//viewer/src/test/db:schema), and its documentation and diagrams in
# docs/database (mise run db:diagram). The database is the one SchemaDatabase builds from the
# migrations, at DATABASE_URL
dsn: ${DATABASE_URL}
docPath: docs/database
er:
  format: mermaid
  comment: true
exclude:
  # Flyway's own: a history of each module's migrations
  - flyway_schema_history_*
# a viewpoint for each module: the tables its migrations make (viewer/src/main/resources/db/migration
# /<module>). A table in none fails tbls lint (the test //viewer/src/test/db:schema)
viewpoints:
  - id: catalogue
    name: catalogue
    desc: >-
      The acts, their versions and dates, and their texts' preparation in each language; the
      changes Cellar reports for them.
    tables:
      - act
      - act_amendment
      - act_change
      - act_date
      - act_publication
      - act_publication_title
      - act_title
      - change_scan
      - expression
      - preparation
      - preparation_step
      - text_step_act_count
      - text_step_count
      - version
      - version_formex
  - id: comparison
    name: comparison
    desc: The comparisons of two texts, kept by their identities in the content module.
    tables:
      - text_comparison
      - text_comparison_whole
  - id: content
    name: content
    desc: The texts themselves, one row each, with its outline.
    tables:
      - text
  - id: ingest
    name: ingest
    desc: The jobs that build the texts.
    tables:
      - ingest_job
  - id: events
    name: events
    desc: Spring Modulith's event publication registry, which every module shares (__root).
    tables:
      - event_publication
lint:
  requireViewpoints:
    enabled: true
  # every table says what it holds: COMMENT ON in the migration that makes it. Columns only where
  # their name does not say it, so no rule for them
  requireTableComment:
    enabled: true
