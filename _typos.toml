# Words typos would "correct" that are right: the Official Journal's name in Spanish, Portuguese and
# Romanian (Diario Oficial, Jornal Oficial, Jurnalul Oficial), and the Union's initials in French,
# Spanish, Italian and Portuguese (Règlement d'exécution (UE) 2015/1998), and the suffix of a short
# ordinal ("2nd subpara.")
[default.extend-words]
oficial = "oficial"
jornal = "jornal"
ue = "ue"
nd = "nd"
