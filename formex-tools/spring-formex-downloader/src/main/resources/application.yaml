logging:
  file:
    path: ${app.stateDir}/logs

spring:
  application:
    name: formex-downloader

  threads:
    virtual:
      enabled: true  # Use virtual threads for all async operations

  datasource:
    url: jdbc:sqlite:${app.dataDir}/formex.db?journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 25

  sql:
    init:
      mode: never  # Disabled: Exposed will manage formex_documents schema

  lifecycle:
    timeout-per-shutdown-phase: 30s

  main:
    banner-mode: off

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0  # Sample 100% of requests for debugging (use 0.1 in production for 10%)

formex:
  storage:
    directory: ${app.dataDir}/xml-files
  features:
    progressbar: true

sparql:
  endpoint: https://publications.europa.eu/webapi/rdf/sparql
  language: eng

camel:
  main:
    duration-max-idle-seconds: 30
