# Test configuration - inherits from application.yaml
# Overrides: in-memory DB, mock SPARQL, Maven target directory for test artifacts

# Test directories - write to target instead of user's home directory
app:
  dataDir: ${maven.build.directory:target}/formex-downloader-test/data
  stateDir: ${maven.build.directory:target}/formex-downloader-test/state

# Prevent Camel timer routes from auto-executing during tests
camel:
  springboot:
    main-run-controller: false

logging:
  file:
    path: ${maven.build.directory:target}/formex-downloader-test/logs

spring:
  datasource:
    # Use file-based shared cache for multi-connection tests
    # This allows parallel batch processing with multiple connections to access the same database
    url: "jdbc:sqlite:file::memory:?cache=shared"
    hikari:
      maximum-pool-size: 5  # Allow multiple concurrent connections for failure tracking

  main:
    # Allow test doubles to override production beans
    allow-bean-definition-overriding: true

formex:
  storage:
    directory: ${maven.build.directory:target}/test-xml-files

sparql:
  # Mock SPARQL endpoint for tests (use MockWebServer at this URL)
  endpoint: http://localhost:9999/sparql
