spring:
  datasource:
    url: "jdbc:sqlite::memory:"
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-formex.sql

  main:
    allow-bean-definition-overriding: true

formex:
  storage:
    directory: ./build/test-xml-files

sparql:
  endpoint: http://localhost:9999/sparql
  language: eng
