spring:
  datasource:
    url: "jdbc:duckdb:"
    driver-class-name: org.duckdb.DuckDBDriver
    hikari:
      maximum-pool-size: 1

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-formex.sql

  main:
    allow-bean-definition-overriding: true

sparql:
  endpoint: http://localhost:9999/sparql
  language: eng

sql:
  post-process:
    select: "SELECT id, xml_content FROM formex_documents WHERE version IS NULL"
    update: "UPDATE formex_documents SET version = ?, root_element = ? WHERE id = ?"
