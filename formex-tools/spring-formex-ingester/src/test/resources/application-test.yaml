spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: false

  batch:
    jdbc:
      initialize-schema: never
      platform: h2
    job:
      enabled: false

  main:
    allow-bean-definition-overriding: true

sparql:
  endpoint: http://localhost:9999/sparql
  language: eng

sql:
  post-process:
    select: "SELECT id, xml_content FROM formex_documents WHERE version IS NULL"
    update: "UPDATE formex_documents SET version = ?, root_element = ? WHERE id = ?"
