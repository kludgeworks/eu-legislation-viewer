# End-to-end test configuration - inherits from application.yaml
# Uses in-memory SQLite and real EU SPARQL endpoint
# Overrides: in-memory DB, strict error handling, Maven target directory

spring:
  datasource:
    url: "jdbc:sqlite:file:e2e-test.db?mode=memory&cache=shared"
    hikari:
      maximum-pool-size: 10
      auto-commit: false

  sql:
    init:
      continue-on-error: false

  main:
    allow-bean-definition-overriding: true

  artemis:
    mode: embedded
    embedded:
      enabled: true
      persistent: false  # In-memory for tests (faster, no cleanup needed)
      queues:
        - cellar.data.queue

formex:
  storage:
    directory: ${maven.build.directory:target}/e2e-xml-files

sparql:
  limit: 2
