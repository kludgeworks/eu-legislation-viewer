logging:
  file:
    path: ${app.stateDir}/logs

spring:
  application:
    name: formex-ingester

  datasource:
    url: jdbc:sqlite:${app.dataDir}/formex.db?journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 10

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false  # Disabled: JobLauncherEntrypoint handles all job launches

  sql:
    init:
      mode: never  # Disabled: Exposed will manage formex_documents schema

  lifecycle:
    timeout-per-shutdown-phase: 30s

  artemis:
    mode: embedded
    embedded:
      enabled: true
      persistent: true
      data-directory: ${app.stateDir}/artemis
      queues:
        - ${formex.jms.cellar-data-queue}

  jms:
    template:
      # Receive timeout for JmsTemplate.receiveAndConvert()
      # Reader signals end-of-queue after this timeout (null = wait indefinitely)
      # Set to 1 second - fast signal when queue is empty
      receive-timeout: 1000

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0  # Sample 100% of requests for debugging (use 0.1 in production for 10%)

formex:
  jms:
    # Single source of truth for JMS queue name
    # Referenced by: spring.artemis.embedded.queues and JmsProperties
    cellar-data-queue: cellar.data.queue
  storage:
    directory: ${app.dataDir}/xml-files
  features:
    # CLI Progress Bars (default: true)
    # - When true: Rich progress bars displayed, logs to file only
    # - When false: No progress bars, logs to both console and file
    # - Set via CLI: --formex.features.cli-progress=false
    cli-progress: true
  batch:
    skip-percentage: 0.5  # Allow up to 0.5% of total URIs to be skipped (errors) before failing the job

sparql:
  endpoint: https://publications.europa.eu/webapi/rdf/sparql
  language: eng
