spring:
  application:
    name: formex-ingester

  datasource:
    url: jdbc:sqlite:./formex.db?journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 10

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  sql:
    init:
      mode: never  # Disabled: Exposed will manage formex_documents schema

  lifecycle:
    timeout-per-shutdown-phase: 30s

formex:
  storage:
    directory: ./formex-xml-files

sparql:
  endpoint: https://publications.europa.eu/webapi/rdf/sparql
  language: eng
