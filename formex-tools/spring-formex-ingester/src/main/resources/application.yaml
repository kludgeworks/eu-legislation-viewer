spring:
  application:
    name: formex-ingester

  datasource:
    url: jdbc:h2:file:./formex;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  batch:
    jdbc:
      initialize-schema: never
      platform: h2
    job:
      enabled: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

sparql:
  endpoint: https://publications.europa.eu/webapi/rdf/sparql
  language: eng
