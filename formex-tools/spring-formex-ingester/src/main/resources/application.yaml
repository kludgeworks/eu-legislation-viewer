spring:
  application:
    name: formex-ingester

  datasource:
    url: jdbc:h2:file:./formex;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  batch:
    jdbc:
      initialize-schema: always
      platform: h2
    job:
      enabled: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

sparql:
  endpoint: https://publications.europa.eu/webapi/rdf/sparql

temp:
  dir: ${java.io.tmpdir}/formex-ingester/xml

