spring:
  application:
    name: formex-ingester

  datasource:
    url: jdbc:duckdb:./formex.db
    driver-class-name: org.duckdb.DuckDBDriver
    hikari:
      maximum-pool-size: 1

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-formex.sql

  lifecycle:
    timeout-per-shutdown-phase: 30s

sparql:
  endpoint: https://publications.europa.eu/webapi/rdf/sparql
  language: eng
