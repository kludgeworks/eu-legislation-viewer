# Bazel's downloader checks rewrite rules without the URL scheme and tries each match in order.
# Maven Central (repo1.maven.org) intermittently returns 429 Too Many Requests to CI runners, so
# keep it first for newly published releases and fall back to Google's Maven Central mirrors
# (every pinned artifact still has its SHA-256 verified by Bazel).
rewrite repo1\.maven\.org/maven2/(.*) https://repo1.maven.org/maven2/$1
rewrite repo1\.maven\.org/maven2/(.*) https://maven-central.storage-download.googleapis.com/maven2/$1
rewrite repo1\.maven\.org/maven2/(.*) https://maven-central-eu.storage-download.googleapis.com/maven2/$1
