# SPDX-License-Identifier: MIT
# ste.Passive and Kludgeworks.Passive (ASD-STE100 rule 3.6) on a rule's name, whose words hyphens
# join: is-named, is-not-built, is-left-out
extends: existence
message: "'%s' may be passive voice (STE 3.6). Use the active voice unless the actor is unknown."
level: warning
ignorecase: true
scope: rulename
raw:
  - \b(am|are|were|being|is|been|was|be)\b-(not-)?
tokens:
  - '[\w]+ed'
  - built
  - chosen
  - done
  - drawn
  - driven
  - given
  - held
  - hidden
  - kept
  - known
  - made
  - read
  - seen
  - sent
  - set
  - shown
  - taken
  - told
  - written
  - left
  - found
  - lost
  - meant
  - put
exceptions:
  - is-not-known
  - are-not-known
