# SPDX-License-Identifier: MIT
# ste.SentenceLength (ASD-STE100 rule 6.3, 25 words in a description), with each number, act and
# provision one word, as a reader reads it: 2021/255, 6.8.5.5, 3(1)(9a), Cellar's
extends: occurrence
message: "Sentence has more than 25 words; split it (STE 6.3)."
level: warning
scope: sentence
max: 25
token: \w[\w./()'’-]*
