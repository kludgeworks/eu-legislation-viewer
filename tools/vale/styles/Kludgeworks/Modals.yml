# ste.Modals (ASD-STE100 rule 3.2), but "May" the month is no modal: 24 May, May 2026, May 24. A
# sentence can still start with the modal May.
extends: existence
message: "'%s' is not an approved modal (STE 3.2). Write can, will, or must, or restate as a condition."
level: error
ignorecase: true
tokens:
  - should
  - would
  - might
  - could
  - '(?!(?-i:May)(?:\s+(?:[0-9]{4}|[0-3]?[0-9])\b|(?<=\b[0-3]?[0-9] May)))may'
