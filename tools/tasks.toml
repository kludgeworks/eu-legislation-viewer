# SPDX-License-Identifier: MIT
#:schema https://mise.jdx.dev/schema/mise-task.json

# The commands people and CI run, the ones that aren't scripts of their own (those are in tasks/,
# beside this file). mise reads it through task_config.includes in mise.toml.

[build]
description = "Build everything"
run = "bazel build //..."

[test]
description = "Run every test"
run = "bazel test //..."

[app]
description = "Run the viewer, on the Postgres at spring.datasource.*"
run = "bazel run //viewer:app"

["app:dev"]
description = "Run the viewer with its store and Grafana in containers (Docker), kept across runs"
run = "bazel run //viewer:dev"

["test:xspec"]
description = "Run the XSpec suites"
run = "bazel test //formex-converter/src/test/xspec/..."

[expected]
description = "Rewrite the converter's expected output from the fixtures, after a deliberate change"
run = "bazel run //formex-converter/src/test/java/dev/groknull/kludgeworks/formex/converter:update_expected"

[modules]
description = "Write the modules' documentation (Spring Modulith's Documenter) into viewer/spring-modulith-docs"
run = "bazel run //viewer/src/test/java/dev/groknull/kludgeworks/eu/legislation/viewer:modules"

["db:diagram"]
description = "Write the database's documentation and diagrams (tbls, Mermaid) into docs/database, from the migrations"
run = "bazel run //viewer/src/test/db:diagram"

[pin]
description = "Pin the Maven dependencies after changing them in MODULE.bazel"
run = "REPIN=1 bazel run @maven//:pin"

[check]
description = "Run every hk check on every file"
run = "hk check --all"

[fix]
description = "Run every hk fixer on every file"
run = "hk fix --all"

# With a usage spec, mise passes the files as $usage_file, each shell-quoted: set -- unquotes them,
# a file name's spaces, brackets and quotes kept
["lint:xml"]
description = "Check that XML files are well-formed"
quiet = true
usage = 'include file="{{config_root}}/tools/tasks/lint/xml.usage.kdl"'
run = 'eval "set -- $usage_file"; jbang tools/tasks/lint/xml.java "$@"'

["lint:mise-tasks"]
description = "Check mise.toml holds no tasks: they belong here or in tasks/"
run = '''
if taplo get -o json -f mise.toml tasks >/dev/null 2>&1; then
  echo "mise.toml: tasks belong in tools/tasks.toml or tools/tasks/" >&2
  exit 1
fi
'''
