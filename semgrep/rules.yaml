# SPDX-License-Identifier: MIT
rules:
  - id: jooq-no-sql-string-concatenation
    languages:
      - java
    severity: ERROR
    message: "Avoid dynamic string concatenation or String.format in jOOQ queries. Use jOOQ DSL type-safe query builders and bind parameters instead to prevent SQL injection."
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      technology:
        - java
        - jooq
    patterns:
      - pattern-either:
          - pattern: $CTX.query($STR + $X, ...)
          - pattern: $CTX.query(String.format(...), ...)
          - pattern: $CTX.resultQuery($STR + $X, ...)
          - pattern: $CTX.resultQuery(String.format(...), ...)
          - pattern: DSL.query($STR + $X, ...)
          - pattern: DSL.query(String.format(...), ...)
          - pattern: DSL.resultQuery($STR + $X, ...)
          - pattern: DSL.resultQuery(String.format(...), ...)
          - pattern: DSL.raw($STR + $X, ...)
          - pattern: DSL.raw(String.format(...), ...)
          - pattern: DSL.condition($STR + $X, ...)
          - pattern: DSL.condition(String.format(...), ...)

  - id: jdbc-no-raw-sql-concatenation
    languages:
      - java
    severity: ERROR
    message: "Avoid dynamic string concatenation or String.format in JDBC statements. Use PreparedStatement with parameterized queries or jOOQ DSL builders instead."
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      technology:
        - java
        - jdbc
    patterns:
      - pattern-either:
          - pattern: $STMT.execute($STR + $X, ...)
          - pattern: $STMT.execute(String.format(...), ...)
          - pattern: $STMT.executeQuery($STR + $X, ...)
          - pattern: $STMT.executeQuery(String.format(...), ...)
          - pattern: $STMT.executeUpdate($STR + $X, ...)
          - pattern: $STMT.executeUpdate(String.format(...), ...)
          - pattern: $CONN.prepareStatement($STR + $X, ...)
          - pattern: $CONN.prepareStatement(String.format(...), ...)

  - id: no-design-document-references
    languages:
      - regex
    severity: ERROR
    message: "Don't cite the design document or the research notes (Design: …, D-NN, Research: …) in comments: they aren't in the repo, so the reference can't be followed. Say what the code does instead."
    metadata:
      category: maintainability
    paths:
      include:
        - "viewer/src/**"
      exclude:
        # Flyway checksums applied migrations: their comments can't change
        - "viewer/src/main/resources/db/migration/**/V*.sql"
        - "viewer/src/test/resources/**"
    pattern-regex: '\(Design\b|\bDesign:|\bD-\d{2}\b|\(Research:'

  - id: htmx-4-event-names
    languages:
      - regex
    severity: ERROR
    message: "htmx 4 names its events in lowercase with colons (htmx:after:settle). It never fires a camelCase htmx 2 name (htmx:afterSettle), so a listener for one never runs."
    metadata:
      category: correctness
    paths:
      include:
        - "viewer/src/**/*.js"
        - "viewer/src/**/*.jte"
    pattern-regex: '\bhtmx:[a-z]+[A-Z]\w*'

  - id: modulith-no-named-interface
    languages:
      - regex
    severity: ERROR
    message: "Don't open a module's package to other modules with @NamedInterface. A module's API is its root package, and its events. If another module needs code from a sub-package, the code is in the wrong module: move it, or publish an event."
    metadata:
      category: architecture
    paths:
      include:
        - "viewer/src/**/*.java"
    pattern-regex: '@(org\.springframework\.modulith\.)?NamedInterface\b'

  - id: modulith-no-allowed-dependencies
    languages:
      - regex
    severity: ERROR
    message: "Don't list a module's dependencies with allowedDependencies. Spring Modulith already rejects cycles and the use of another module's internals. A list that pins the graph pushes code into the wrong module."
    metadata:
      category: architecture
    paths:
      include:
        - "viewer/src/**/*.java"
    pattern-regex: '\ballowedDependencies\s*='

  # All jte templates compile into one generated package, so the Java rules of the modules can't see
  # which module a template belongs to. The folder of a template says it: jte/catalogue/ is the
  # catalogue's, jte/comparison/ the comparison's, jte/layout/ the chrome module's, and jte/legal/
  # and jte/legalpart/ the legaltext library's. A module's API (its root package) and the library are
  # open to every template.
  - id: jte-catalogue-uses-only-its-module
    languages:
      - regex
    severity: ERROR
    message: "A catalogue template uses another module's internals. A template in jte/catalogue/ belongs to the catalogue: it may use the catalogue's packages, any module's API (its root package) and the legaltext library, but no other module's sub-packages. Move the template to the module that owns the type, or have that module publish what the catalogue needs in its API."
    metadata:
      category: architecture
    paths:
      include:
        - "viewer/src/main/jte/catalogue/**/*.jte"
    pattern-regex: '\bdev\.groknull\.kludgeworks\.eu\.legislation\.viewer\.(?!catalogue\.)[a-z]\w*\.[a-z]\w*'

  - id: jte-comparison-uses-only-its-module
    languages:
      - regex
    severity: ERROR
    message: "A comparison template uses another module's internals. A template in jte/comparison/ belongs to the comparison: it may use the comparison's packages, any module's API (its root package) and the legaltext library, but no other module's sub-packages. Move the template to the module that owns the type, or have that module publish what the comparison needs in its API."
    metadata:
      category: architecture
    paths:
      include:
        - "viewer/src/main/jte/comparison/**/*.jte"
    pattern-regex: '\bdev\.groknull\.kludgeworks\.eu\.legislation\.viewer\.(?!comparison\.)[a-z]\w*\.[a-z]\w*'

  - id: jte-chrome-uses-only-its-module
    languages:
      - regex
    severity: ERROR
    message: "A layout template uses another module's internals. A template in jte/layout/ belongs to the chrome module: it may use the chrome's packages, any module's API (its root package) and the legaltext library, but no other module's sub-packages. Move the template to the module that owns the type, or have that module publish what the layout needs in its API."
    metadata:
      category: architecture
    paths:
      include:
        - "viewer/src/main/jte/layout/**/*.jte"
    pattern-regex: '\bdev\.groknull\.kludgeworks\.eu\.legislation\.viewer\.(?!chrome\.)[a-z]\w*\.[a-z]\w*'

  - id: jte-library-uses-only-module-apis
    languages:
      - regex
    severity: ERROR
    message: "A library's template uses a module's internals. The templates in jte/legal/ and jte/legalpart/ belong to the legaltext library, which every module's pages use: they may use a module's API (its root package), but no module's sub-packages."
    metadata:
      category: architecture
    paths:
      include:
        - "viewer/src/main/jte/legal/**/*.jte"
        - "viewer/src/main/jte/legalpart/**/*.jte"
    pattern-regex: '\bdev\.groknull\.kludgeworks\.eu\.legislation\.viewer\.[a-z]\w*\.[a-z]\w*'

  - id: jte-folder-has-an-owner
    languages:
      - regex
    severity: ERROR
    message: "This template is in a folder that no rule names, so nothing checks which module's types it uses. Put it in its module's or its library's folder, or add the new folder to the jte rules in semgrep/rules.yaml."
    metadata:
      category: architecture
    paths:
      include:
        - "viewer/src/main/jte/**/*.jte"
      exclude:
        - "viewer/src/main/jte/catalogue/**"
        - "viewer/src/main/jte/comparison/**"
        - "viewer/src/main/jte/layout/**"
        - "viewer/src/main/jte/legal/**"
        - "viewer/src/main/jte/legalpart/**"
    pattern-regex: '(?s)\A.'
