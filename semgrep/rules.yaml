# SPDX-License-Identifier: MIT
rules:
  - id: jooq-no-sql-string-concatenation
    languages:
      - java
    severity: ERROR
    message: "Avoid dynamic string concatenation or String.format in jOOQ queries. Use jOOQ DSL type-safe query builders and bind parameters instead to prevent SQL injection."
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      technology:
        - java
        - jooq
    patterns:
      - pattern-either:
          - pattern: $CTX.query($STR + $X, ...)
          - pattern: $CTX.query(String.format(...), ...)
          - pattern: $CTX.resultQuery($STR + $X, ...)
          - pattern: $CTX.resultQuery(String.format(...), ...)
          - pattern: DSL.query($STR + $X, ...)
          - pattern: DSL.query(String.format(...), ...)
          - pattern: DSL.resultQuery($STR + $X, ...)
          - pattern: DSL.resultQuery(String.format(...), ...)
          - pattern: DSL.raw($STR + $X, ...)
          - pattern: DSL.raw(String.format(...), ...)
          - pattern: DSL.condition($STR + $X, ...)
          - pattern: DSL.condition(String.format(...), ...)

  - id: jdbc-no-raw-sql-concatenation
    languages:
      - java
    severity: ERROR
    message: "Avoid dynamic string concatenation or String.format in JDBC statements. Use PreparedStatement with parameterized queries or jOOQ DSL builders instead."
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      technology:
        - java
        - jdbc
    patterns:
      - pattern-either:
          - pattern: $STMT.execute($STR + $X, ...)
          - pattern: $STMT.execute(String.format(...), ...)
          - pattern: $STMT.executeQuery($STR + $X, ...)
          - pattern: $STMT.executeQuery(String.format(...), ...)
          - pattern: $STMT.executeUpdate($STR + $X, ...)
          - pattern: $STMT.executeUpdate(String.format(...), ...)
          - pattern: $CONN.prepareStatement($STR + $X, ...)
          - pattern: $CONN.prepareStatement(String.format(...), ...)

  - id: no-design-document-references
    languages:
      - regex
    severity: ERROR
    message: "Don't cite the design document or the research notes (Design: …, D-NN, Research: …) in comments: they aren't in the repo, so the reference can't be followed. Say what the code does instead."
    metadata:
      category: maintainability
    paths:
      include:
        - "viewer/src/**"
      exclude:
        # Flyway checksums applied migrations: their comments can't change
        - "viewer/src/main/resources/db/migration/**/V*.sql"
        - "viewer/src/test/resources/**"
    pattern-regex: '\(Design\b|\bDesign:|\bD-\d{2}\b|\(Research:'

  - id: htmx-4-event-names
    languages:
      - regex
    severity: ERROR
    message: "htmx 4 names its events in lowercase with colons (htmx:after:settle). It never fires a camelCase htmx 2 name (htmx:afterSettle), so a listener for one never runs."
    metadata:
      category: correctness
    paths:
      include:
        - "viewer/src/**/*.js"
        - "viewer/src/**/*.jte"
    pattern-regex: '\bhtmx:[a-z]+[A-Z]\w*'
