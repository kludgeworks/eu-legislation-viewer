# SPDX-License-Identifier: MIT
# Valkey: the broadcast events between the viewer's instances (Redis Streams), and the cache of
# the rendered HTML of texts. What it holds is passing, so it keeps nothing on disk. When the cache
# is full, Valkey drops the keys read longest ago. Its sidecar, redis_exporter, gives Valkey's own
# statistics on the port metrics: slow commands, latency, clients, memory, evictions. A cluster
# with the VictoriaMetrics operator collects them with components/victoriametrics.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
spec:
  replicas: 1
  # the old one stopped before the new one starts: two at once would split the viewers between
  # them, each missing the other's entries
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
    spec:
      automountServiceAccountToken: false
      securityContext:
        # the image's user (valkey)
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          # as the tests' (TestcontainersConfiguration)
          image: valkey/valkey:9.1.2
          # maxmemory below the container's memory limit: a full cache drops the keys read
          # longest ago (allkeys-lru), not only the expired ones
          args: [--save, "", --appendonly, "no", --maxmemory, 200mb, --maxmemory-policy, allkeys-lru]
          ports:
            - name: valkey
              containerPort: 6379
          livenessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 30
          readinessProbe:
            exec:
              command: [valkey-cli, ping]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
        - name: exporter
          image: oliver006/redis_exporter:v1.97.0
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels:
    app.kubernetes.io/name: valkey
spec:
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
