# SPDX-License-Identifier: MIT
server:
  # links at the host and path a proxy forwards (X-Forwarded-*, Forwarded), read by Spring itself
  forward-headers-strategy: framework

spring:
  # requests and the conversions done ahead on virtual threads: a page mostly waits on Cellar
  threads:
    virtual:
      enabled: true
  http:
    clients:
      # every RestClient Boot builds, so Cellar's: to open a connection, and for a response, since
      # large SPARQL results take minutes; redirects followed (Cellar's 303s)
      connect-timeout: 10s
      read-timeout: 5m
  cache:
    # Spring's caches in Valkey, always there (acts: ActsCacheConfiguration)
    type: redis
  mvc:
    # errors as RFC 9457 problem details (application/problem+json)
    problemdetails:
      enabled: true

viewer:
  acts:
    # how long an act may be cached: its timeline changes only when Cellar publishes a consolidation
    cache-for: 1h
  cellar:
    sparql-endpoint: https://publications.europa.eu/webapi/rdf/sparql
    # where Cellar's resource URIs start (…/resource/celex/32015R1998)
    resources: http://publications.europa.eu/resource/
    # sent with every request: who we are and where to reach us
    user-agent: kludgeworks-viewer/0.0 (+https://kludgeworks.groknull.dev)
    # a SPARQL result with this many rows may have been cut off by the endpoint
    max-rows: 1000000
  expressions:
    # how long the languages a document has Formex in are kept, as an act is
    languages-for: 1h
    # how long a request waits for a text being converted before answering 503 (most take well
    # under a second; the largest, minutes)
    wait-for: 30s
    store:
      # longer than the largest conversion (2005/396, 77 MB of Formex)
      lock-timeout: 10m
      # how often a request waiting on another's conversion looks for its result
      poll-interval: 250ms
      # how long a document without Formex in a language is remembered as such
      absent-for: 1d
