# SPDX-License-Identifier: MIT
server:
  forward-headers-strategy: framework
  compression:
    enabled: true

spring:
  application:
    name: viewer
  profiles:
    group:
      prod:
        - json-logs
  threads:
    virtual:
      enabled: true
  task:
    execution:
      mode: force
  data:
    redis:
      connect-timeout: 2s
      timeout: 5s
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 5m
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true
  mvc:
    problemdetails:
      enabled: true
    apiversion:
      use:
        media-type-parameter:
          "[application/hal+json]": version
      supported: 1
      default: 1
  jooq:
    sql-dialect: postgres
  flyway:
    validate-migration-naming: true
  modulith:
    runtime:
      flyway-enabled: true
    events:
      completion-mode: delete
      republish-outstanding-events-on-restart: false
      staleness:
        published: 2h
        processing: 1h
        resubmitted: 1h
      jdbc:
        schema-initialization:
          enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith
  tracing:
    sampling:
      probability: 1.0

gg:
  jte:
    use-precompiled-templates: true

viewer:
  catalogue:
    search:
      start-delay: 1h
      check-every: 1h
      tuning:
        typo-threshold: 0.60
        weights:
          number-or-name: 1.0
          subject: 0.6
          title-and-topics: 0.15
        not-in-force: 0.5
    changes:
      every: 5m
      overlap: 30m
      lag: 20m
      quiet: 10m
      at-most: 60m
      withdrawn-after: 30m
  cellar:
    sparql-endpoint: https://publications.europa.eu/webapi/rdf/sparql
    resources: http://publications.europa.eu/resource/
    user-agent: kludgeworks-viewer/0.0 (+https://kludgeworks.groknull.dev)
    max-rows: 1000000
  ingest:
    max-conversions: 2
    workers: 2
    takeover: 50m
    max-attempts: 3
  content:
    outline-cache:
      size: 200
  legaltext:
    html-cache:
      ttl: 7d
