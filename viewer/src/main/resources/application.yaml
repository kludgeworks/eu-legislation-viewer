# SPDX-License-Identifier: MIT
server:
  # links at the host and path a proxy forwards (X-Forwarded-*, Forwarded), read by Spring itself
  forward-headers-strategy: framework

spring:
  application:
    # the service in logs, traces and metrics
    name: viewer
  profiles:
    # one profile per concern (application-<profile>.yaml), grouped by where the app runs; without a
    # profile (tests, running locally) logs are plain text
    group:
      # a deployment: SPRING_PROFILES_ACTIVE=prod
      prod:
        - json-logs
  # requests and conversions on virtual threads: they mostly wait on Cellar
  threads:
    virtual:
      enabled: true
  http:
    clients:
      # every RestClient Boot builds, so Cellar's: to open a connection, and for a response, since
      # large SPARQL results take minutes; redirects followed (Cellar's 303s)
      connect-timeout: 10s
      read-timeout: 5m
  web:
    resources:
      chain:
        strategy:
          content:
            # each asset's URL with a hash of its content in it (/css/viewer-<hash>.css, the pages'
            # links: Chrome.Assets), so a page never runs a copy a browser kept from before it changed
            enabled: true
            paths: /**
      cache:
        cachecontrol:
          # and so kept as long as a browser likes: a change is a new URL
          max-age: 365d
          cache-public: true
  mvc:
    # errors as RFC 9457 problem details (application/problem+json)
    problemdetails:
      enabled: true
  # the store: Postgres at spring.datasource.* (locally a container: TestcontainersConfiguration)
  jooq:
    sql-dialect: postgres
  modulith:
    runtime:
      # each module's migrations in db/migration/<module>, with its own history table; what the whole
      # app shares (the event publication registry) in db/migration/__root
      flyway-enabled: true
    events:
      # a completed publication is deleted, not kept: nothing reads them, so nothing has to purge them
      completion-mode: delete
      jdbc:
        # its table is a migration (db/migration/__root), not created by Modulith on startup
        schema-initialization:
          enabled: false

management:
  endpoints:
    web:
      exposure:
        # the modules and their dependencies (Spring Modulith's insight) beside health
        include: health,info,modulith
  tracing:
    sampling:
      # every request traced: little traffic, and a first read spans request, job and root swap
      probability: 1.0

gg:
  jte:
    # the templates as jte_library precompiled them (//viewer/src/main/jte): no jte compiler at run time
    use-precompiled-templates: true

viewer:
  cellar:
    sparql-endpoint: https://publications.europa.eu/webapi/rdf/sparql
    # where Cellar's resource URIs start (…/resource/celex/32015R1998)
    resources: http://publications.europa.eu/resource/
    # sent with every request: who we are and where to reach us
    user-agent: kludgeworks-viewer/0.0 (+https://kludgeworks.groknull.dev)
    # a SPARQL result with this many rows may have been cut off by the endpoint
    max-rows: 1000000
  ingest:
    # how many conversions run at once, the others waiting their turn: the largest takes about 1 GB
    # of heap (2016/2070's 87 MB file)
    max-conversions: 2
    # how many jobs an instance runs at once: each mostly converting, so no more than conversions
    workers: 2
    # how often an idle worker looks for a job queued on another instance, or given up by one
    poll: 1s
    # how long a job is held without its worker's heartbeat, before another worker may claim it
    lease: 2m
    heartbeat: 30s
    # how often a job is tried before it fails: refusals (no Formex, not a legal act) fail at once
    max-attempts: 3
