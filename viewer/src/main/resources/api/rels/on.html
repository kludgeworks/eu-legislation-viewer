<p>The law on a day. The link is a template with one variable, <span class="mono">date</span>. For example, <span class="mono">2022-02-14</span>.</p>
<p>The answer has the versions of the act that apply on that day, and the day until which they apply. It also has
  the acts that apply on that day, but that only a later version includes.</p>
