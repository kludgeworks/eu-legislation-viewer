[versions]
kotlin = "1.9.25"
spring-boot = "3.4.5"
spring-dependency-management = "1.1.7"
graalvm-native = "0.10.6"
cyclonedx-bom = "1.10.0"
kotlinx-datetime = "0.5.0"
kotlinx-coroutines = "1.8.0"
spring-shell = "3.4.0"
spring-modulith = "1.3.3"
apache-jena = "5.3.0"
jakarta-xml-bind = "4.0.1"
jaxb = "4.0.3"
jspecify = "1.0.0"
mockito-kotlin = "5.2.1"
intershop-jaxb = "7.0.1"
arrow = "2.1.2"

[libraries]
# Kotlin
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-reactive = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactive", version.ref = "kotlinx-coroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }

# Spring
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-shell-starter-jna = { module = "org.springframework.shell:spring-shell-starter-jna" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }
spring-shell-starter-test = { module = "org.springframework.shell:spring-shell-starter-test" }
spring-shell-bom = { module = "org.springframework.shell:spring-shell-dependencies", version.ref = "spring-shell" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }

# Jackson
jackson-dataformat-xml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-xml" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

# Apache Jena
jena-core = { module = "org.apache.jena:jena-core", version.ref = "apache-jena" }
jena-arq = { module = "org.apache.jena:jena-arq", version.ref = "apache-jena" }
jena-rdfconnection = { module = "org.apache.jena:jena-rdfconnection", version.ref = "apache-jena" }

# JAXB
jakarta-xml-bind-api = { module = "jakarta.xml.bind:jakarta.xml.bind-api", version.ref = "jakarta-xml-bind" }
jaxb-runtime = { module = "org.glassfish.jaxb:jaxb-runtime", version.ref = "jaxb" }
jaxb-impl = { module = "com.sun.xml.bind:jaxb-impl", version.ref = "jaxb" }

# Arrow
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
arrow-fx-coroutines = { module = "io.arrow-kt:arrow-fx-coroutines", version.ref = "arrow" }
arrow-optics = { module = "io.arrow-kt:arrow-optics", version.ref = "arrow" }

# Other
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-native" }
cyclonedx-bom = { id = "org.cyclonedx.bom", version.ref = "cyclonedx-bom" }
intershop-jaxb = { id = "com.intershop.gradle.jaxb", version.ref = "intershop-jaxb" }