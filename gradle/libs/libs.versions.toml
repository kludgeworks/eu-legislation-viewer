[versions]
kotlin = "2.1.21"
spring-boot = "3.5.0"
spring-dependency-management = "1.1.7"
graalvm-native = "0.10.6"
cyclonedx-bom = "1.10.0"
kotlinx-datetime = "0.6.2"
kotlinx-coroutines = "1.10.2"
kotlinx-serialization = "1.6.2"
spring-shell = "3.4.0"
spring-modulith = "1.3.5"
apache-jena = "5.3.0"
jakarta-xml-bind = "4.0.1"
jaxb = "4.0.3"
jspecify = "1.0.0"
mockito-kotlin = "5.2.1"
intershop-jaxb = "7.0.1"
arrow = "2.1.2"
ktor = "3.1.3"
rdf4j = "4.3.8"
apache-http = "4.5.14"
xmlutil = "0.84.3"
picocli = "4.7.6"
mockk = "1.13.12"

[libraries]
# Kotlin
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }

# Spring
spring-modulith-starter-core = { module = "org.springframework.modulith:spring-modulith-starter-core" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-modulith-starter-test = { module = "org.springframework.modulith:spring-modulith-starter-test" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# Apache Jena
jena-core = { module = "org.apache.jena:jena-core", version.ref = "apache-jena" }
jena-arq = { module = "org.apache.jena:jena-arq", version.ref = "apache-jena" }
jena-cmds = { module = "org.apache.jena:jena-cmds", version.ref = "apache-jena" }

# JAXB
jakarta-xml-bind-api = { module = "jakarta.xml.bind:jakarta.xml.bind-api", version.ref = "jakarta-xml-bind" }
jaxb-runtime = { module = "org.glassfish.jaxb:jaxb-runtime", version.ref = "jaxb" }
jaxb-impl = { module = "com.sun.xml.bind:jaxb-impl", version.ref = "jaxb" }

# Arrow
arrow-core = { module = "io.arrow-kt:arrow-core", version.ref = "arrow" }
arrow-fx-coroutines = { module = "io.arrow-kt:arrow-fx-coroutines", version.ref = "arrow" }
arrow-optics = { module = "io.arrow-kt:arrow-optics", version.ref = "arrow" }

# Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-xml = { module = "io.ktor:ktor-serialization-kotlinx-xml", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# Other
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
apache-httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "apache-http" }
xmlutil-serialization-jvm = { module = "io.github.pdvrieze.xmlutil:serialization-jvm", version.ref = "xmlutil" }

# Picocli
picocli-spring-boot-starter = { module = "info.picocli:picocli-spring-boot-starter", version.ref = "picocli" }

# MockK
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

# RDF4J
rdf4j-repository-sparql = { module = "org.eclipse.rdf4j:rdf4j-repository-sparql", version.ref = "rdf4j" }
rdf4j-repository-http = { module = "org.eclipse.rdf4j:rdf4j-repository-http", version.ref = "rdf4j" }
rdf4j-queryresultio-sparqljson = { module = "org.eclipse.rdf4j:rdf4j-queryresultio-sparqljson", version.ref = "rdf4j" }
rdf4j-queryresultio-sparqlxml = { module = "org.eclipse.rdf4j:rdf4j-queryresultio-sparqlxml", version.ref = "rdf4j" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-native" }
cyclonedx-bom = { id = "org.cyclonedx.bom", version.ref = "cyclonedx-bom" }
intershop-jaxb = { id = "com.intershop.gradle.jaxb", version.ref = "intershop-jaxb" }
